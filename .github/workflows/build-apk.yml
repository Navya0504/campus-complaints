name: Build Android APK

# Run it by hand: GitHub -> Actions -> "Build Android APK" -> Run workflow
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Build the web app
        env:
          VITE_API_URL: https://campus-complaints-8ilo.onrender.com
          VITE_CLOUDINARY_CLOUD: zpnvw03d
          VITE_CLOUDINARY_PRESET: complaints
        run: npm run build

      - name: Create the Android project
        run: npx cap add android

      - name: Force the fixed signing key
        working-directory: frontend/android
        run: |
          echo "Key file in repo:"
          keytool -list -v -keystore ${{ github.workspace }}/android-signing/debug.keystore -storepass android | grep SHA1
          cat >> app/build.gradle <<EOF

          android {
              signingConfigs {
                  debug {
                      storeFile file("${{ github.workspace }}/android-signing/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          EOF

      - name: Copy the web app into it
        run: npx cap sync android

      - name: Build the APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Show the APK signing SHA-1
        working-directory: frontend/android
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -i "SHA-1"

      - name: Save the APK
        uses: actions/upload-artifact@v4
        with:
          name: campus-resolve-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk